# Local stack for this service: `docker compose up --build`
# (the full multi-repo stack will live in the infra repo)
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-npd_rp}
      POSTGRES_USER: ${DB_USER:-npd_rp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-npd_rp}
    ports:
      # Host port from .env; inside the Docker network Postgres is always on 5432
      - "${DB_PORT:-5433}:5432"
    volumes:
      # Postgres 18 image stores data under /var/lib/postgresql/18/docker
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      # Container-to-container connection, overrides the host values in .env
      DB_HOST: postgres
      DB_PORT: 5432
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
