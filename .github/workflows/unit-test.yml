name: CI
on:
  pull_request:
    branches: [main, develop]
  # Sonar necesita un análisis de cada rama base para comparar contra ella los PRs
  push:
    branches: [main, develop]

# Solo necesita leer el código; Sonar comenta el PR con su propia GitHub App
permissions:
  contents: read

jobs:
  unit-test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions fijadas por SHA (comentario = versión) para que nadie pueda cambiar su código bajo la misma etiqueta
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # Sonar usa el historial completo de git para saber qué líneas son nuevas
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven
      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      # verify: tests (Testcontainers; el runner ya trae Docker) + reporte de JaCoCo.
      # sonar: envía código y cobertura a SonarQube Cloud y falla si el quality gate no pasa
      # (sonar.qualitygate.wait=true en pom.xml).
      - name: Run Unit Tests and SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
