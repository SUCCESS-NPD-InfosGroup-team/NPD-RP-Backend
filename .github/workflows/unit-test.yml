name: CI
on:
  pull_request:
    branches: [main, develop]

# Solo necesita leer el código del PR
permissions:
  contents: read

jobs:
  unit-test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven
      # verify ejecuta los tests y deja listo el punto donde se engancharía un umbral de cobertura (JaCoCo).
      # Los tests usan Testcontainers; el runner ubuntu-latest ya trae Docker.
      - name: Run Unit Tests
        run: ./mvnw -B verify
