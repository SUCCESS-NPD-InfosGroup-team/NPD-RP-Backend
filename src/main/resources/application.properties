spring.application.name=api

# Railway injects PORT; defaults to 8080 locally
server.port=${PORT:8080}

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:npd_rp}
spring.datasource.username=${DB_USER:npd_rp}
spring.datasource.password=${DB_PASSWORD:npd_rp}

# Schema is owned by Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

# IDE runs: spring-boot-docker-compose starts only the database, not the api container
spring.docker.compose.start.arguments=postgres

# API versioning (Spring Framework 7): path segment 1 of /api/ routes, as in /api/v1/planner/resources
# (the resolver is set in shared/config/ApiVersionConfig). Routes outside /api/ carry no version.
spring.mvc.apiversion.supported=1
spring.mvc.apiversion.required=false

# User-facing texts: messages.properties is Spanish, the default for every client
spring.messages.fallback-to-system-locale=false
spring.web.locale=es

# Pagination of unbounded lists (?page=0&size=25): 25 items by default, 100 at most
spring.data.web.pageable.default-page-size=25
spring.data.web.pageable.max-page-size=100

# Keycloak realm that issues the access tokens
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/npd-rp}

# Keycloak Admin REST API, called as the API's own service account to manage users
# (see docs/specs/SCRUM-93/design.md). The application does not start without the secret.
app.keycloak.issuer-uri=${spring.security.oauth2.resourceserver.jwt.issuer-uri}
app.keycloak.admin-client-id=${KEYCLOAK_ADMIN_CLIENT_ID:npd-rp-api-admin}
app.keycloak.admin-client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET:}
app.keycloak.connect-timeout=2s
app.keycloak.read-timeout=5s
# Invitation email: the user sets the password and goes back to the frontend's resources page.
# Both variables are required: without them the redirect is not a URL and the application does not start.
app.keycloak.frontend-client-id=${KEYCLOAK_FRONTEND_CLIENT_ID:}
app.keycloak.invitation-redirect-uri=${APP_FRONTEND_URL:}/recursos
app.keycloak.invitation-lifespan=48h

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# API docs (OpenAPI + Scalar): only in dev mode, off unless APP_DEV_MODE=true
app.dev-mode=${APP_DEV_MODE:false}
springdoc.api-docs.enabled=${app.dev-mode}
springdoc.api-docs.path=/v3/api-docs
scalar.enabled=${app.dev-mode}
scalar.path=/scalar
